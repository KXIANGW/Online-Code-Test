version: 1
# IsolateEngine resolves commands via execve(), which needs absolute paths.
# DockerEngine wraps cmd in `sh -c "<cmd> < input"` so the shell does PATH
# lookup for it. Absolute paths work for both, so always use absolute paths.
languages:
  - id: cpp17
    image: oct-sandbox-cpp:12
    source:
      filename: solution.cpp
    compile:
      cmd: ["/usr/local/bin/g++", "solution.cpp", "-O2", "-std=c++17", "-o", "solution", "-lm"]
    run:
      cmd: ["/code/solution"]
    enabled: true

  - id: python3
    image: oct-sandbox-python:3.11
    source:
      filename: solution.py
    compile:
      cmd: ["/usr/local/bin/python3", "-m", "py_compile", "solution.py"]
    run:
      cmd: ["/usr/local/bin/python3", "/code/solution.py"]
      env:
        PYTHONUNBUFFERED: "1"
        PYTHONDONTWRITEBYTECODE: "1"
    enabled: true
