apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common-worker.fullname" . }}
  labels:
    {{- include "common-worker.labels" . | nindent 4 }}
spec:
  # KEDA's ScaledObject takes over replicas once it's reconciled; this
  # field is only honoured for the brief window before the first scale.
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "common-worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common-worker.selectorLabels" . | nindent 8 }}
      {{- with .Values.metrics.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "common-worker.serviceAccountName" . }}
      {{- if .Values.runtimeClassName }}
      runtimeClassName: {{ .Values.runtimeClassName }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 60
      {{- if eq .Values.sandboxEngine "isolate" }}
      initContainers:
        - name: wait-rootfs
          # Blocks Worker startup until the language-rootfs-puller DaemonSet
          # on this Node has finished its first eager pull. Without this the
          # Worker would briefly return RootfsNotReady for every task.
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              for lang in cpp17 python3; do
                until [ -e "{{ .Values.rootfsHostPath }}/$lang" ]; do
                  echo "waiting for language rootfs: $lang"
                  sleep 5
                done
              done
              echo "rootfs ready"
          volumeMounts:
            - name: rootfs-cache
              mountPath: {{ .Values.rootfsHostPath }}
              readOnly: true
      {{- end }}
      containers:
        - name: worker
          image: {{ include "common-worker.imageRef" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: SANDBOX_ENGINE
              value: {{ .Values.sandboxEngine | quote }}
            {{- if eq .Values.sandboxEngine "isolate" }}
            - name: ROOTFS_BASE_DIR
              value: {{ .Values.rootfsHostPath | quote }}
            # oct-seccomp-wrapper + seccomp.policy bundle. IsolateEngine
            # binds this dir into every sandbox box and prepends the wrapper
            # before the candidate command, installing a Docker-equivalent
            # syscall blacklist (worker/sandbox/isolate-seccomp.policy).
            - name: SECCOMP_BUNDLE_DIR
              value: {{ .Values.seccompBundleDir | default "/etc/oct" | quote }}
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.probe.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.probe.path }}
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: {{ .Values.probe.path }}
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.dockerSocket.enabled }}
            - name: docker-sock
              mountPath: /var/run/docker.sock
            {{- end }}
            {{- if .Values.hostWorkDir.enabled }}
            - name: host-work
              mountPath: {{ .Values.env.HOST_WORK_DIR | default "/tmp/judge" }}
            {{- end }}
            {{- if eq .Values.sandboxEngine "isolate" }}
            - name: rootfs-cache
              mountPath: {{ .Values.rootfsHostPath }}
              readOnly: true
            - name: isolate-state
              mountPath: /var/local/lib/isolate
            {{- end }}
      volumes:
        {{- if .Values.dockerSocket.enabled }}
        - name: docker-sock
          hostPath:
            path: {{ .Values.dockerSocket.hostPath }}
            type: Socket
        {{- end }}
        {{- if .Values.hostWorkDir.enabled }}
        - name: host-work
          hostPath:
            path: {{ .Values.hostWorkDir.hostPath }}
            type: DirectoryOrCreate
        {{- end }}
        {{- if eq .Values.sandboxEngine "isolate" }}
        - name: rootfs-cache
          hostPath:
            path: {{ .Values.rootfsHostPath }}
            type: DirectoryOrCreate
        - name: isolate-state
          emptyDir: {}
        {{- end }}
