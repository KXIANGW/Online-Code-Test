apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  # 💡 這裡不寫死 replicas: 1，而是交給 values.yaml 控制，後續會被 KEDA 動態覆蓋
  replicas: {{ .Values.replicaCount | default 1 }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: worker
          # 核心：動態組合你在 values.yaml 寫的 repository 和指令帶入的 tag
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          
          # 這裡可以放 Worker 執行時需要的環境變數（暫時留空，之後可以在 values.yaml 加）
          envFrom: []
          env:
            - name: RABBITMQ_URL
              value: {{ .Values.rabbitmq.url | quote }}
            - name: DATABASE_URL
              value: {{ .Values.database.url | quote }}
          # 防爆資源限制，直接對齊 values.yaml 裡設定的數值
          resources:
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
