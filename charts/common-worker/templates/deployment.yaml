apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common-worker.fullname" . }}
  labels:
    {{- include "common-worker.labels" . | nindent 4 }}
spec:
  # KEDA's ScaledObject takes over replicas once it's reconciled; this
  # field is only honoured for the brief window before the first scale.
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "common-worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common-worker.selectorLabels" . | nindent 8 }}
      {{- with .Values.metrics.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "common-worker.serviceAccountName" . }}
      {{- if .Values.runtimeClassName }}
      runtimeClassName: {{ .Values.runtimeClassName }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: {{ include "common-worker.imageRef" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.probe.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: {{ .Values.probe.path }}
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: {{ .Values.probe.path }}
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.dockerSocket.enabled }}
            - name: docker-sock
              mountPath: /var/run/docker.sock
            {{- end }}
            {{- if .Values.hostWorkDir.enabled }}
            - name: host-work
              mountPath: {{ .Values.env.HOST_WORK_DIR | default "/tmp/judge" }}
            {{- end }}
      volumes:
        {{- if .Values.dockerSocket.enabled }}
        - name: docker-sock
          hostPath:
            path: {{ .Values.dockerSocket.hostPath }}
            type: Socket
        {{- end }}
        {{- if .Values.hostWorkDir.enabled }}
        - name: host-work
          hostPath:
            path: {{ .Values.hostWorkDir.hostPath }}
            type: DirectoryOrCreate
        {{- end }}
