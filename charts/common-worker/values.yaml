# Default values for common-worker.
# Override at install time:
#   helm install oct-worker ./charts/common-worker \
#     --set image.tag=<git-sha> \
#     --set env.RABBITMQ_URL=amqp://oct:<pass>@rabbitmq:5672 \
#     --set env.DATABASE_URL=postgres://oct:<pass>@postgres:5432/oct

image:
  repository: ghcr.io/kxiangw/oct-worker
  tag: ""                    # default to .Chart.AppVersion
  pullPolicy: IfNotPresent

# minReplicaCount in scaledobject overrides this once KEDA is installed.
replicaCount: 1

# Pod resource requests / limits. Phase A sandbox runs at 1 CPU / 256MB
# *per container*; worker process itself stays small (Node + dockerode).
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "2"
    memory: 1Gi

# gVisor RuntimeClass — applies to the worker pod (not to per-submission
# sandbox containers, which are spawned via the host Docker socket).
# Set to "" if your cluster does not have RuntimeClass=gvisor.
runtimeClassName: ""

# --- Sandbox engine selection -----------------------------------------------
# "isolate" (default): per-testcase sandbox runs via sio2project/isolate.
#                       Requires the language-rootfs-puller DaemonSet (chart
#                       `language-rootfs-puller`) to be deployed so per-language
#                       rootfs is unpacked under hostPath /var/lib/oct/rootfs.
# "docker" (legacy):    per-testcase sandbox runs as a Docker container via
#                       the host Docker socket. Requires Docker on the Node.
sandboxEngine: isolate

# When sandboxEngine=isolate, the readonly hostPath the puller writes to.
rootfsHostPath: /var/lib/oct/rootfs

# Backend env wiring. Override via --set or values file.
env:
  RABBITMQ_URL: "amqp://oct:oct_dev_password@rabbitmq:5672"
  DATABASE_URL: "postgres://oct:oct_dev_password_change_me@postgres:5432/oct"
  HOST_WORK_DIR: "/tmp/judge"
  SANDBOX_RUNTIME: "runc"    # set to "runsc" when sandboxEngine=docker AND host has gVisor
  NODE_ENV: "production"
  LOG_LEVEL: "info"

# /metrics is served from the same port as /healthz (see worker/src/healthcheck.ts).
metrics:
  enabled: true
  port: 8080
  path: /metrics
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"

probe:
  port: 8080
  path: /healthz

# Mount the host's Docker socket into the worker. Required ONLY when
# sandboxEngine=docker — the legacy engine launches per-testcase sandbox
# containers via dockerode -> dockerd. When sandboxEngine=isolate this
# mount is unused (and arguably a security regression), so default off.
dockerSocket:
  enabled: false
  hostPath: /var/run/docker.sock

# Bind-mount the host's work dir so per-submission /tmp/judge/<id> is
# visible to spawned sandbox containers.
hostWorkDir:
  enabled: true
  hostPath: /tmp/judge

serviceAccount:
  create: true
  name: ""                   # default {{ include "common-worker.fullname" . }}
  annotations: {}

podSecurityContext:
  runAsNonRoot: false        # node user owns docker.sock on many distros
  fsGroup: 0

securityContext:
  # privileged: true is required for sandboxEngine=isolate because the cgroup
  # FS at /sys/fs/cgroup is delivered read-only to non-privileged containers,
  # which makes isolate's `--cg` fail to create the box cgroup. The
  # candidate code's safety still relies on (a) the oct-seccomp-wrapper
  # syscall blacklist, (b) isolate's own user/pid/net/mnt namespaces, and
  # (c) the readonly rootfs bind mounts.
  #
  # When sandboxEngine=docker, override `privileged: false` and add
  # `capabilities.drop: [ALL]` — the legacy DockerEngine path does not
  # need cgroup write access on the Worker itself.
  privileged: true

service:
  type: ClusterIP
  port: 8080

# ── KEDA ScaledObject ────────────────────────────────────────────────────
# Disable if you don't have KEDA installed; default to enabled because
# autoscaling is the whole point of this chart for the demo.
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 5
  pollingInterval: 5
  cooldownPeriod: 30
  triggers:
    # Average sandbox CPU across all worker pods; matches loadtest watcher.
    cpu:
      query: avg(rate(container_cpu_usage_seconds_total{pod=~"oct-worker.*"}[30s]))*100
      threshold: "80"
    # Per-worker desired in-flight; >1 means workers are saturated.
    inFlight:
      query: sum(judge_in_flight)
      threshold: "1"
    # Backlog in the RabbitMQ task queue.
    queueDepth:
      query: sum(rabbitmq_queue_messages{queue="judge.tasks"})
      threshold: "5"
  prometheusAddress: http://prometheus-operated.monitoring.svc:9090
