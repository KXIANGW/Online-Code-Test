map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Identify the serving frontend pod (HA visibility). Inherited by every
    # location since none of them declare their own add_header. The backend's
    # own X-Served-By (pod@node) is proxied through on /api responses.
    add_header X-Frontend-Pod $hostname always;

    # Reverse proxy API requests to the backend service inside the compose network.
    location /online_code_test/api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Serve the same built SPA from the nginx subpath used in production.
    location /online_code_test/assets/ {
        alias /usr/share/nginx/html/assets/;
    }

    location /online_code_test/ {
        try_files /index.html =404;
    }

    # SPA fallback - let React Router handle unknown root paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
