name: oct

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oct}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oct_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-oct}
    ports:
      - "${HOST_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Two-stage gate:
      # 1. pg_isready -h 127.0.0.1: forces TCP (only open after ALL
      #    docker-entrypoint-initdb.d scripts finish; UNIX socket is available
      #    mid-init and would pass too early).
      # 2. SELECT 1 FROM users LIMIT 1: confirms scenario seed data exists.
      #    If the volume has leftover partial data (e.g. from a crashed init),
      #    this gate stays unhealthy and backend never starts with bad state.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB} && psql -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tc 'SELECT 1 FROM users LIMIT 1' 2>/dev/null | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-oct}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-oct_dev_password}
    ports:
      - "${HOST_RABBITMQ_PORT:-5672}:5672"
      - "${HOST_RABBITMQ_MGMT_PORT:-15672}:15672"
      - "${HOST_RABBITMQ_PROM_PORT:-15692}:15692"
    volumes:
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5672 || exit 1"] # test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 3s         # 從 10s 縮短到 3s，反應更快
      timeout: 5s
      retries: 10
      start_period: 15s    # 給它 15 秒暖身時間，這期間不計入失敗

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${HOST_REDIS_PORT:-6379}:6379"
    volumes:
      - ./infra/redis/redis.conf:/etc/redis/redis.conf
      - redisdata:/data
    command: redis-server /etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://oct:oct_dev_password_change_me@postgres:5432/oct}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://oct:oct_dev_password@rabbitmq:5672}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-oct_dev_jwt_secret_change_me_32_chars}
      ENCRYPTION_SECRET: ${ENCRYPTION_SECRET:-000102030405060708090a0b0c0d0e0f000102030405060708090a0b0c0d0e0f}
      PORT: ${BACKEND_PORT:-3000}
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${HOST_BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${BACKEND_PORT:-3000}/api/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 60s

  worker:
    build:
      context: ./worker
    restart: unless-stopped
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://oct:oct_dev_password@rabbitmq:5672}
      DATABASE_URL: ${DATABASE_URL:-postgres://oct:oct_dev_password_change_me@postgres:5432/oct}
      HOST_WORK_DIR: ${HOST_WORK_DIR:-/tmp/judge}
      # IsolateEngine is now the only sandbox engine (Phase 4 / Step B).
      # `make build-isolate-rootfs` populates HOST_ROOTFS_DIR before
      # `docker compose up worker`.
      ROOTFS_BASE_DIR: /var/lib/oct/rootfs
      SECCOMP_BUNDLE_DIR: /etc/oct
      NODE_ENV: ${NODE_ENV:-development}
    # privileged: required by isolate v2.0 `--cg --init` to write under
    # /sys/fs/cgroup (Docker mounts it read-only without privileged, even
    # with cap_add: SYS_ADMIN). Matches k8s/08-worker.yaml.
    privileged: true
    volumes:
      - ${HOST_WORK_DIR:-/tmp/judge}:${HOST_WORK_DIR:-/tmp/judge}
      # Local Isolate rootfs cache, populated by `make build-isolate-rootfs`.
      # type=bind so docker doesn't auto-create an empty named volume.
      - type: bind
        source: ${HOST_ROOTFS_DIR:-/tmp/oct-rootfs}
        target: /var/lib/oct/rootfs
        read_only: true
        bind:
          create_host_path: true
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"] # 換成 wget 較安全
      interval: 5s         # 縮短間隔
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  adminer:
    image: adminer:5.4.2
    restart: unless-stopped
    ports:
      - "${HOST_ADMINER_PORT:-8082}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=2h"
      - "--storage.tsdb.retention.size=512MB"
      - "--web.enable-lifecycle"
    ports:
      - "${HOST_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-oct_dev_grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "${HOST_GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    command:
      - "--housekeeping_interval=10s"
      - "--docker_only=true"
      - "--store_container_labels=false"
    ports:
      - "${HOST_CADVISOR_PORT:-8081}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg

volumes:
  pgdata:
    name: oct_pgdata
  redisdata:
    name: oct_redisdata
  promdata:
    name: oct_promdata
  grafanadata:
    name: oct_grafanadata
