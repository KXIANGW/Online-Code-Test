name: CI

on:
  push:
    branches: ["**"]

jobs:
  frontend:
    name: Frontend — lint / test / build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend — lint / test
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oct
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: oct
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Apply schema in order before running tests
      - name: Apply database schema
        env:
          PGPASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: |
          for f in $(ls ../infra/postgres/[0-9]*.sql | sort); do
            psql -h localhost -U oct -d oct -f "$f"
          done

      - run: npm run lint

      - name: Run unit tests
        env:
          TEST_DATABASE_URL: postgres://oct:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/oct
          JWT_SECRET: test-secret-minimum-32-chars-for-jwt-signing
        run: npm test

  build-images:
    name: Build & push ${{ matrix.service }} (SHA)
    needs: [frontend, backend]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: worker
            context: ./worker
          - service: frontend
            context: ./frontend
            build-args: VITE_API_BASE=/api

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag (first 10 chars of commit SHA)
        id: tag
        run: echo "value=${GITHUB_SHA::10}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/oct-${{ matrix.service }}:${{ steps.tag.outputs.value }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
