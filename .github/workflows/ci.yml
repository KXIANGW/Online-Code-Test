name: CI

on:
  push:
    branches: ["**"]

jobs:
  frontend:
    name: Frontend — lint / test / build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend — lint / test
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oct
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'oct_dev_password' }}
          POSTGRES_DB: oct
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run format:check

      # Apply schema in order before running tests
      - name: Apply database schema
        env:
          PGPASSWORD: ${{ secrets.CI_DB_PASSWORD || 'oct_dev_password' }}
        run: |
          for f in $(ls ../infra/postgres/[0-9]*.sql | sort); do
            psql -h localhost -U oct -d oct -f "$f"
          done

      - run: npm run lint

      - name: Run unit tests
        env:
          TEST_DATABASE_URL: postgres://oct:${{ secrets.CI_DB_PASSWORD || 'oct_dev_password' }}@localhost:5432/oct_test
          JWT_SECRET: test-secret-minimum-32-chars-for-jwt-signing
        run: npm test

  build-images:
    name: Build & push staging image for ${{ matrix.service }}
    needs: [frontend, backend]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: worker
            context: ./worker
          - service: frontend
            context: ./frontend
            build-args: VITE_API_BASE=/api
          - service: language-rootfs-puller
            context: ./worker/puller

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag and lowercase owner
        id: tag
        run: |
          echo "value=ci-${GITHUB_SHA::10}" >> $GITHUB_OUTPUT
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.tag.outputs.owner }}/oct-${{ matrix.service }}:${{ steps.tag.outputs.value }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  build-sandbox-images:
    # Sandbox runner images (oct-sandbox-cpp / oct-sandbox-python) are
    # pulled per-testcase by the judge worker. Push them to ghcr.io so
    # Phase D (Helm) workers can reference them without a host build.
    name: Build & push sandbox-${{ matrix.lang }} (SHA)
    needs: [backend]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: cpp
            context: ./worker/sandbox/cpp17
          - lang: python
            context: ./worker/sandbox/python3

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag and lowercase owner
        id: tag
        run: |
          echo "value=ci-${GITHUB_SHA::10}" >> $GITHUB_OUTPUT
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.tag.outputs.owner }}/oct-sandbox-${{ matrix.lang }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=sandbox-${{ matrix.lang }}
          cache-to: type=gha,scope=sandbox-${{ matrix.lang }},mode=max

  promote-main-images:
    name: Promote main image for ${{ matrix.image }}
    if: github.ref == 'refs/heads/main'
    needs: [build-images, build-sandbox-images]
    runs-on: ubuntu-22.04
    permissions:
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: oct-backend
            latest: "false"
          - image: oct-worker
            latest: "false"
          - image: oct-frontend
            latest: "false"
          - image: oct-language-rootfs-puller
            latest: "true"
          - image: oct-sandbox-cpp
            latest: "true"
          - image: oct-sandbox-python
            latest: "true"

    steps:
      - name: Compute image tags and lowercase owner
        id: tag
        run: |
          echo "staging=ci-${GITHUB_SHA::10}" >> $GITHUB_OUTPUT
          echo "deploy=main-${GITHUB_SHA::10}" >> $GITHUB_OUTPUT
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Promote staging tag
        run: |
          image="ghcr.io/${{ steps.tag.outputs.owner }}/${{ matrix.image }}"
          if [ "${{ matrix.latest }}" = "true" ]; then
            docker buildx imagetools create \
              -t "${image}:${{ steps.tag.outputs.deploy }}" \
              -t "${image}:latest" \
              "${image}:${{ steps.tag.outputs.staging }}"
          else
            docker buildx imagetools create \
              -t "${image}:${{ steps.tag.outputs.deploy }}" \
              "${image}:${{ steps.tag.outputs.staging }}"
          fi

