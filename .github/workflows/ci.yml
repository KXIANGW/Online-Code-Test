name: CI

on:
  push:
    branches: ["**"]

jobs:
  frontend:
    name: Frontend — lint / test / build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/coverage-summary.json
          retention-days: 7
      - run: npm run build

  backend:
    name: Backend — lint / test / build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oct
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'oct_dev_password' }}
          POSTGRES_DB: oct
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run format:check

      # Apply schema in order before running tests
      - name: Apply database schema
        env:
          PGPASSWORD: ${{ secrets.CI_DB_PASSWORD || 'oct_dev_password' }}
        run: |
          which psql || (sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client)
          for f in $(ls ../infra/postgres/[0-9]*.sql | sort); do
            psql -h localhost -U oct -d oct -f "$f"
          done

      - run: npm run lint

      - name: Run unit tests
        env:
          TEST_DATABASE_URL: postgres://oct:${{ secrets.CI_DB_PASSWORD || 'oct_dev_password' }}@localhost:5432/oct_test
          JWT_SECRET: test-secret-minimum-32-chars-for-jwt-signing
          TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672
        run: npm test

      - name: Run coverage
        env:
          TEST_DATABASE_URL: postgres://oct:${{ secrets.CI_DB_PASSWORD || 'oct_dev_password' }}@localhost:5432/oct_test
          JWT_SECRET: test-secret-minimum-32-chars-for-jwt-signing
          TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672
        run: npm run coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage/coverage-summary.json
          retention-days: 7
      - run: npm run build

  worker:
    name: Worker — lint / test / build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-worker
          path: worker/coverage/coverage-summary.json
          retention-days: 7
      - run: npm run build

  worker-puller:
    name: Worker puller — lint / test / build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: worker/puller
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/puller/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-worker-puller
          path: worker/puller/coverage/coverage-summary.json
          retention-days: 7
      - run: npm run build

  coverage-summary:
    name: Coverage Summary
    needs: [frontend, backend, worker, worker-puller]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-reports/

      - name: Generate combined coverage summary
        run: |
          node - << 'SCRIPT'
          const fs = require('fs');
          const modules = [
            { name: 'Frontend',      file: 'coverage-reports/coverage-frontend/coverage-summary.json' },
            { name: 'Backend',       file: 'coverage-reports/coverage-backend/coverage-summary.json' },
            { name: 'Worker',        file: 'coverage-reports/coverage-worker/coverage-summary.json' },
            { name: 'Worker Puller', file: 'coverage-reports/coverage-worker-puller/coverage-summary.json' },
          ];
          const fmt = n => n.toFixed(1) + '%';
          const icon = n => n >= 85 ? '✅' : '❌';
          const rows = modules.map(({ name, file }) => {
            if (!fs.existsSync(file)) return `| ${name} | — | — | — | — |`;
            const t = JSON.parse(fs.readFileSync(file, 'utf8')).total;
            return `| ${name} | ${fmt(t.lines.pct)} ${icon(t.lines.pct)} | ${fmt(t.statements.pct)} ${icon(t.statements.pct)} | ${fmt(t.branches.pct)} ${icon(t.branches.pct)} | ${fmt(t.functions.pct)} ${icon(t.functions.pct)} |`;
          });
          const md = [
            '## 📊 Code Coverage Summary',
            '',
            '| Module | Lines | Statements | Branches | Functions |',
            '|--------|-------|------------|----------|-----------|',
            ...rows,
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + '\n');
          SCRIPT

  e2e:
    name: E2E — API + Browser tests
    runs-on: ubuntu-22.04
    needs: [frontend, backend, worker, worker-puller]

    # Surfaced as env so the conditional Docker Hub login can skip when the
    # secret is not configured (keeps CI green before the secret is added).
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            worker/package-lock.json

      - name: Log in to Docker Hub (raise pull rate limit, fewer registry flakes)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Bootstrap environment
        run: make bootstrap

      - name: Install worker dependencies for sandbox image build
        working-directory: worker
        run: npm ci

      - name: Build sandbox images
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 20
          command: make sandbox-images

      - name: Build isolate rootfs
        run: make -C worker build-isolate-rootfs

      - name: Start full Docker stack
        run: docker compose up -d --build --wait
        timeout-minutes: 10

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run API E2E tests (Vitest)
        working-directory: e2e
        run: npx vitest run

      - name: Run Browser E2E tests (Playwright)
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  build-images:
    name: Build & push staging image for ${{ matrix.service }}
    needs: [frontend, backend, worker, worker-puller]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: worker
            context: ./worker
          - service: frontend
            context: ./frontend
            build-args: VITE_API_BASE=
          - service: language-rootfs-puller
            context: ./worker/puller

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag and lowercase owner
        id: tag
        run: |
          echo "value=ci-${GITHUB_SHA::10}" >> $GITHUB_OUTPUT
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (raise pull rate limit, fewer registry flakes)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.tag.outputs.owner }}/oct-${{ matrix.service }}:${{ steps.tag.outputs.value }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  build-sandbox-images:
    # Sandbox runner images (oct-sandbox-cpp / oct-sandbox-python) are
    # pulled per-testcase by the judge worker. Push them to ghcr.io so
    # Phase D (Helm) workers can reference them without a host build.
    name: Build & push sandbox-${{ matrix.lang }} (SHA)
    needs: [worker]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: cpp
            context: ./worker/sandbox/cpp17
          - lang: python
            context: ./worker/sandbox/python3

    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag and lowercase owner
        id: tag
        run: |
          echo "value=ci-${GITHUB_SHA::10}" >> $GITHUB_OUTPUT
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (raise pull rate limit, fewer registry flakes)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.tag.outputs.owner }}/oct-sandbox-${{ matrix.lang }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=sandbox-${{ matrix.lang }}
          cache-to: type=gha,scope=sandbox-${{ matrix.lang }},mode=max

  promote-main-images:
    name: Promote main image for ${{ matrix.image }}
    if: github.ref == 'refs/heads/main'
    needs: [build-images, build-sandbox-images]
    runs-on: ubuntu-22.04
    permissions:
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: oct-backend
            latest: "false"
          - image: oct-worker
            latest: "false"
          - image: oct-frontend
            latest: "false"
          - image: oct-language-rootfs-puller
            latest: "true"
          - image: oct-sandbox-cpp
            latest: "true"
          - image: oct-sandbox-python
            latest: "true"

    steps:
      - name: Compute image tags and lowercase owner
        id: tag
        run: |
          echo "staging=ci-${GITHUB_SHA::10}" >> $GITHUB_OUTPUT
          echo "deploy=main-${GITHUB_SHA::10}" >> $GITHUB_OUTPUT
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Promote staging tag
        run: |
          image="ghcr.io/${{ steps.tag.outputs.owner }}/${{ matrix.image }}"
          if [ "${{ matrix.latest }}" = "true" ]; then
            docker buildx imagetools create \
              -t "${image}:${{ steps.tag.outputs.deploy }}" \
              -t "${image}:latest" \
              "${image}:${{ steps.tag.outputs.staging }}"
          else
            docker buildx imagetools create \
              -t "${image}:${{ steps.tag.outputs.deploy }}" \
              "${image}:${{ steps.tag.outputs.staging }}"
          fi
