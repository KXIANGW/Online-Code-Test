name: CI

on:
  push:
    branches: ["**"]

jobs:
  frontend:
    name: Frontend — lint / test / build
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend — lint / test
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oct
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: oct
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Apply schema in order before running tests
      - name: Apply database schema
        env:
          PGPASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        run: |
          for f in $(ls ../infra/postgres/[0-9]*.sql | sort); do
            psql -h localhost -U oct -d oct -f "$f"
          done

      - run: npm run lint

      - name: Run unit tests
        env:
          TEST_DATABASE_URL: postgres://oct:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/oct
          JWT_SECRET: test-secret-minimum-32-chars-for-jwt-signing
        run: npm test
