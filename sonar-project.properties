# SonarScanner config for the OCT monorepo.
# Treats frontend / backend / worker / puller as independent modules so each
# gets its own coverage report and quality gate context.
#
# Run via the bundled scanner profile:
#   SONAR_TOKEN=<token> docker compose -f docker-compose.sonar.yml --profile scan run --rm scanner

sonar.projectKey=oct
sonar.projectName=Online Code Test
sonar.projectVersion=0.1.0

# Default host. When run via docker-compose.sonar.yml the scanner overrides this
# with SONAR_HOST_URL=http://sonarqube:9000 (compose network). Leave localhost
# here so a host-side `sonar-scanner` CLI also works out of the box.
sonar.host.url=http://localhost:9000

sonar.sourceEncoding=UTF-8

# Four independent modules. worker/puller/ is a separate npm package (its own
# package.json, tsconfig, vitest config) so it gets its own module entry rather
# than being treated as a sub-path of `worker`.
sonar.modules=frontend,backend,worker,puller

# ── Frontend ────────────────────────────────────────────────────────────────
frontend.sonar.projectName=oct-frontend
frontend.sonar.sources=src
frontend.sonar.tests=src/__test__
frontend.sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
frontend.sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,src/main.tsx
frontend.sonar.coverage.exclusions=**/__test__/**,**/*.test.ts,**/*.test.tsx,src/main.tsx
frontend.sonar.javascript.lcov.reportPaths=coverage/lcov.info
frontend.sonar.typescript.tsconfigPath=tsconfig.json
frontend.sonar.projectBaseDir=frontend

# ── Backend ─────────────────────────────────────────────────────────────────
backend.sonar.projectName=oct-backend
backend.sonar.sources=src
# Note: backend/src/__e2e__/ was relocated to the repo-root `e2e/` directory
# when main absorbed the Playwright/Docker e2e suite. If we ever want Sonar
# to analyse those e2e files, add a 5th module pointing at `./e2e`.
backend.sonar.tests=src/__tests__
backend.sonar.test.inclusions=**/*.test.ts
backend.sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,src/server.ts
backend.sonar.coverage.exclusions=**/__tests__/**,**/*.test.ts,src/server.ts,src/db/migrate.ts
backend.sonar.javascript.lcov.reportPaths=coverage/lcov.info
backend.sonar.typescript.tsconfigPath=tsconfig.json
backend.sonar.projectBaseDir=backend

# ── Worker ──────────────────────────────────────────────────────────────────
worker.sonar.projectName=oct-worker
worker.sonar.sources=src
worker.sonar.tests=src/__tests__
worker.sonar.test.inclusions=**/*.test.ts
worker.sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/sandbox/rootfs/**,**/*.test.ts
worker.sonar.coverage.exclusions=**/__tests__/**,**/*.test.ts
worker.sonar.javascript.lcov.reportPaths=coverage/lcov.info
worker.sonar.typescript.tsconfigPath=tsconfig.json
worker.sonar.projectBaseDir=worker

# ── Puller ──────────────────────────────────────────────────────────────────
# language-rootfs-puller is the DaemonSet-side helper that pulls sandbox
# language images and extracts them onto the K8s host. Lives at
# worker/puller/ as its own npm package.
puller.sonar.projectName=oct-language-rootfs-puller
puller.sonar.sources=src
puller.sonar.tests=src/__tests__
puller.sonar.test.inclusions=**/*.test.ts
puller.sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts
puller.sonar.coverage.exclusions=**/__tests__/**,**/*.test.ts
puller.sonar.javascript.lcov.reportPaths=coverage/lcov.info
puller.sonar.typescript.tsconfigPath=tsconfig.json
puller.sonar.projectBaseDir=worker/puller

# ── Issue suppression ───────────────────────────────────────────────────────
# typescript:S2068 / javascript:S2068 ("hard-coded credentials") fires on any
# string literal assigned to a property named password/token/secret. Test
# files intentionally use fake credentials as fixtures (e.g.
# `password: "Passw0rd!"` in mocks), so suppress this rule there to keep the
# security-hotspot list focused on real production code.
sonar.issue.ignore.multicriteria=tsTestCreds,jsTestCreds

sonar.issue.ignore.multicriteria.tsTestCreds.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.tsTestCreds.resourceKey=**/__test__/**

sonar.issue.ignore.multicriteria.jsTestCreds.ruleKey=javascript:S2068
sonar.issue.ignore.multicriteria.jsTestCreds.resourceKey=**/__test__/**
