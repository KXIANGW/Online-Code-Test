        {
          "type": "text",
          "title": "How to read this board / node-down drill",
          "id": 1,
          "gridPos": {
            "h": 4,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "options": {
            "mode": "markdown",
            "content": "**Traffic path:** external IKM nginx (`upstream oct_frontend`, round-robin over the ikmlab + 9105 node entry ports) → NodePort 31000 → kube-proxy → frontend pod → backend ClusterIP → backend pod.\n\n**Is traffic going through the LB?** *Frontend ingress requests by node* is the faithful view — it's the external IKM nginx's actual per-node distribution (ingress is node-local via externalTrafficPolicy=Local). *Backend request rate by node* shows the cluster's own kube-proxy balancing across backend pods. Per-request, `curl -I` shows `X-Frontend-Pod` and `X-Served-By: pod@node`.\n\n**Node-down drill:** `kubectl cordon <node>` then delete that node's pods (or power it off). Expect: that node's request rate → 0, the survivor absorbs it, *5xx ratio* stays flat, pods reschedule, replicas recover. The external nginx ejecting the dead upstream is what you see as the per-node traffic shift (k3s-only board; panels backed by kube-state-metrics show *No data* under docker-compose)."
          }
        },
        {
          "type": "stat",
          "title": "Backend pods Ready",
          "id": 2,
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 4
