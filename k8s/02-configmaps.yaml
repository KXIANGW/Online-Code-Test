apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-plugins
  namespace: oct
data:
  enabled_plugins: "[rabbitmq_management,rabbitmq_prometheus]."
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: oct
data:
  redis.conf: |
    maxmemory 256mb
    maxmemory-policy volatile-lru
    appendonly yes
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: oct
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
      external_labels:
        monitor: oct-k8s

    scrape_configs:
      - job_name: backend
        metrics_path: /api/metrics
        static_configs:
          - targets:
              - backend:3000
            labels:
              app: backend

      - job_name: worker
        metrics_path: /metrics
        static_configs:
          - targets:
              - worker:8080
            labels:
              app: worker

      - job_name: cadvisor
        static_configs:
          - targets:
              - cadvisor:8080
            labels:
              app: cadvisor
        scrape_interval: 10s

      - job_name: rabbitmq
        metrics_path: /metrics/per-object
        static_configs:
          - targets:
              - rabbitmq:15692
            labels:
              app: rabbitmq
        scrape_interval: 10s

      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090
