apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: oct
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
        - name: wait-rabbitmq
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done"]
        - name: wait-rootfs
          # Blocks Worker startup until the language-rootfs-puller DaemonSet
          # on this Node has unpacked at least one language under hostPath.
          # Cheaper than a per-call rootfs check inside the engine.
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -eu
              # Block until the symlinks the DaemonSet writes exist.
              # Languages list is mirrored here so Worker stays robust if the
              # puller temporarily stops shipping a particular language.
              for lang in cpp17 python3; do
                until [ -e "/var/lib/oct/rootfs/$lang" ]; do
                  echo "waiting for language rootfs: $lang"
                  sleep 5
                done
              done
              echo "rootfs ready: cpp17 python3"
          volumeMounts:
            - name: rootfs-cache
              mountPath: /var/lib/oct/rootfs
              readOnly: true
      containers:
        - name: worker
          image: ghcr.io/kxiangw/oct-worker:791678336e
          imagePullPolicy: Always
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: oct-secrets
                  key: RABBITMQ_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: oct-secrets
                  key: DATABASE_URL
            - name: HOST_WORK_DIR
              value: "/tmp/oct-k8s-judge"
            - name: SANDBOX_ENGINE
              value: "isolate"
            - name: ROOTFS_BASE_DIR
              value: "/var/lib/oct/rootfs"
            # SECCOMP_BUNDLE_DIR: directory inside the worker image that
            # contains both `seccomp-wrapper` (binary) and `seccomp.policy`
            # (rules). IsolateEngine bind-mounts this dir into every sandbox
            # box, then prepends the wrapper to the candidate's argv —
            # giving us the Docker-equivalent syscall blacklist that
            # upstream isolate v2.0 doesn't provide natively.
            - name: SECCOMP_BUNDLE_DIR
              value: "/etc/oct"
            - name: SANDBOX_RUNTIME
              # Kept so Worker still boots if SANDBOX_ENGINE=docker is set out-of-band.
              value: "runc"
            - name: NODE_ENV
              value: "production"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            # privileged: true is required for isolate's `--cg` to work in a
            # K8s Pod. CAP_SYS_ADMIN alone is NOT enough — the cgroup mount
            # at /sys/fs/cgroup is delivered read-only to non-privileged
            # containers (CRI default) and the kernel rejects the remount
            # even with CAP_SYS_ADMIN.
            #
            # SECURITY: this is comparable to the legacy docker.sock mount in
            # blast radius. Defence in depth: (1) the per-task candidate code
            # runs through oct-seccomp-wrapper which installs a Docker-equivalent
            # syscall blacklist; (2) it runs in isolate's own user/pid/net/mnt
            # namespaces as UID 60000+ with no capabilities; (3) NetworkMode
            # is fully blocked (no loopback either). Future hardening: switch
            # to gVisor RuntimeClass or Kata Containers via the
            # SandboxEngine interface without touching the Worker.
            privileged: true
            runAsUser: 0
          volumeMounts:
            - name: rootfs-cache
              mountPath: /var/lib/oct/rootfs
              readOnly: true
            - name: judge-work
              mountPath: /tmp/oct-k8s-judge
            - name: isolate-state
              mountPath: /var/local/lib/isolate
      volumes:
        - name: rootfs-cache
          hostPath:
            path: /var/lib/oct/rootfs
            type: DirectoryOrCreate
        - name: judge-work
          hostPath:
            path: /tmp/oct-k8s-judge
            type: DirectoryOrCreate
        - name: isolate-state
          emptyDir: {}
      securityContext:
        runAsNonRoot: false
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: oct
spec:
  selector:
    app: worker
  ports:
    - port: 8080
      targetPort: 8080
