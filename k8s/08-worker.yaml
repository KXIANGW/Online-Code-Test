apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: oct
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        - name: prepare-sandbox-images
          image: docker:27-cli
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              docker pull ghcr.io/kxiangw/oct-sandbox-cpp:latest
              docker pull ghcr.io/kxiangw/oct-sandbox-python:latest
              docker tag ghcr.io/kxiangw/oct-sandbox-cpp:latest oct-sandbox-cpp:12
              docker tag ghcr.io/kxiangw/oct-sandbox-python:latest oct-sandbox-python:3.11
              docker image inspect oct-sandbox-cpp:12 oct-sandbox-python:3.11 >/dev/null
              echo "sandbox images are ready"

              keep_ids="$(docker ps --format '{{.Image}}' \
                | xargs -r docker image inspect --format '{{.Id}}' 2>/dev/null || true)"
              keep_ids="$keep_ids
              $(docker image inspect --format '{{.Id}}' \
                ghcr.io/kxiangw/oct-sandbox-cpp:latest \
                ghcr.io/kxiangw/oct-sandbox-python:latest \
                oct-sandbox-cpp:12 \
                oct-sandbox-python:3.11 2>/dev/null || true)"

              docker ps -a --filter status=exited --format '{{.ID}} {{.Image}}' \
                | while read -r container_id image_ref; do
                    [ -n "$container_id" ] || continue
                    image_id="$(docker image inspect --format '{{.Id}}' "$image_ref" 2>/dev/null || true)"
                    [ -n "$image_id" ] || continue
                    echo "$keep_ids" | grep -q "$image_id" && continue
                    case "$image_ref" in
                      ghcr.io/kxiangw/oct-*|oct-sandbox-cpp:12|oct-sandbox-python:3.11)
                        docker rm "$container_id" >/dev/null 2>&1 || true
                        ;;
                    esac
                  done

              docker images --format '{{.Repository}} {{.ID}}' \
                | awk '$1 ~ /^ghcr.io\/kxiangw\/oct-/ {print $2}' \
                | sort -u \
                | while read -r image_id; do
                    [ -n "$image_id" ] || continue
                    echo "$keep_ids" | grep -q "$image_id" && continue
                    docker image rm "$image_id" >/dev/null 2>&1 || true
                  done
              echo "unused OCT images are pruned"
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: ghcr-docker-config
              mountPath: /root/.docker
              readOnly: true
        - name: wait-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"]
        - name: wait-rabbitmq
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done"]
      containers:
        - name: worker
          image: ghcr.io/kxiangw/oct-worker:791678336e
          imagePullPolicy: Always
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: oct-secrets
                  key: RABBITMQ_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: oct-secrets
                  key: DATABASE_URL
            - name: HOST_WORK_DIR
              value: "/tmp/oct-k8s-judge"
            - name: SANDBOX_RUNTIME
              value: "runc"
            - name: NODE_ENV
              value: "production"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
            - name: judge-work
              mountPath: /tmp/oct-k8s-judge
      volumes:
        - name: ghcr-docker-config
          secret:
            secretName: ghcr-secret
            items:
              - key: .dockerconfigjson
                path: config.json
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: judge-work
          hostPath:
            path: /tmp/oct-k8s-judge
            type: DirectoryOrCreate
      securityContext:
        runAsNonRoot: false
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: oct
spec:
  selector:
    app: worker
  ports:
    - port: 8080
      targetPort: 8080
