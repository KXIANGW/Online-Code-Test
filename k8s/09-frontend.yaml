apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: oct
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        - name: wait-backend
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z backend 3000; do echo waiting for backend; sleep 3; done"]
      containers:
        - name: frontend
          image: ghcr.io/kxiangw/oct-frontend:791678336e
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: oct
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30173
