apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: oct
spec:
  replicas: 2
  # maxSurge 0 + maxUnavailable 1: under hard anti-affinity, free a node
  # (terminate an old pod) before scheduling the new one, so rolling
  # updates don't deadlock waiting for a third node that doesn't exist.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      nodeSelector:
        oct-role: app
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: frontend
              topologyKey: kubernetes.io/hostname
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        - name: wait-backend
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z backend 3000; do echo waiting for backend; sleep 3; done"]
      containers:
        - name: frontend
          image: ghcr.io/kxiangw/oct-frontend:791678336e
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: oct
spec:
  type: NodePort
  # Local: a node's NodePort serves only its own frontend pod (1 per node under
  # hard anti-affinity), so the external IKM nginx's per-node routing is not
  # re-balanced by kube-proxy and the real client IP is preserved (no SNAT).
  externalTrafficPolicy: Local
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 31000
