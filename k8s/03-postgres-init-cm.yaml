apiVersion: v1
data:
  00-extensions.sql: |
    -- Runs first on a fresh data volume. All other scripts depend on pgcrypto.
    CREATE EXTENSION IF NOT EXISTS pgcrypto;
  01-enums.sql: |
    -- 5 custom enum types used across all modules
    CREATE TYPE difficulty_level AS ENUM ('easy', 'medium', 'hard');

    CREATE TYPE exam_status AS ENUM (
      'not_started',
      'in_progress',
      'submitted',
      'expired',
      'cancelled'
    );

    CREATE TYPE submission_status AS ENUM (
      'pending',
      'judging',
      'done',
      'system_error'
    );

    CREATE TYPE submission_type AS ENUM (
      'simple',
      'formal'
    );

    CREATE TYPE verdict_type AS ENUM (
      'AC', 'WA', 'TLE', 'MLE', 'RE', 'CE'
    );

    -- skipped = short-circuit when an earlier testcase already failed
    CREATE TYPE testcase_verdict_type AS ENUM (
      'AC', 'WA', 'TLE', 'MLE', 'RE', 'skipped'
    );
  02-iam.sql: |
    -- IAM module: users, roles, permissions, and junction tables
    CREATE TABLE users (
      id            BIGSERIAL    PRIMARY KEY,
      username      VARCHAR(64)  NOT NULL UNIQUE,
      password_hash VARCHAR(255) NOT NULL,
      display_name  VARCHAR(128),
      is_superuser  BOOLEAN      NOT NULL DEFAULT FALSE,
      created_by    BIGINT       REFERENCES users(id),
      created_at    TIMESTAMPTZ  NOT NULL DEFAULT NOW(),
      updated_at    TIMESTAMPTZ  NOT NULL DEFAULT NOW(),
      deleted_at    TIMESTAMPTZ
    );

    CREATE TABLE roles (
      id          BIGSERIAL    PRIMARY KEY,
      name        VARCHAR(64)  NOT NULL UNIQUE,
      description VARCHAR(255),
      created_at  TIMESTAMPTZ  NOT NULL DEFAULT NOW()
    );

    CREATE TABLE permissions (
      id          BIGSERIAL    PRIMARY KEY,
      code        VARCHAR(64)  NOT NULL UNIQUE,
      description VARCHAR(255),
      created_at  TIMESTAMPTZ  NOT NULL DEFAULT NOW()
    );

    CREATE TABLE user_roles (
      user_id    BIGINT      NOT NULL REFERENCES users(id) ON DELETE CASCADE,
      role_id    BIGINT      NOT NULL REFERENCES roles(id) ON DELETE CASCADE,
      granted_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      PRIMARY KEY (user_id, role_id)
    );

    CREATE TABLE role_permissions (
      role_id       BIGINT NOT NULL REFERENCES roles(id)       ON DELETE CASCADE,
      permission_id BIGINT NOT NULL REFERENCES permissions(id) ON DELETE CASCADE,
      PRIMARY KEY (role_id, permission_id)
    );
  03-problems.sql: |
    -- Problem module: language_defaults, problems, testcases, per-language limits
    CREATE TABLE language_defaults (
      language          VARCHAR(32)  PRIMARY KEY,
      display_name      VARCHAR(64)  NOT NULL,
      time_multiplier   NUMERIC(4,2) NOT NULL DEFAULT 1.0 CHECK (time_multiplier > 0),
      memory_multiplier NUMERIC(4,2) NOT NULL DEFAULT 1.0 CHECK (memory_multiplier > 0),
      is_enabled        BOOLEAN      NOT NULL DEFAULT TRUE,
      created_at        TIMESTAMPTZ  NOT NULL DEFAULT NOW()
    );

    CREATE TABLE problems (
      id              BIGSERIAL        PRIMARY KEY,
      title           VARCHAR(255)     NOT NULL,
      description_md  TEXT             NOT NULL,
      difficulty      difficulty_level NOT NULL,
      time_limit_ms   INT              NOT NULL CHECK (time_limit_ms > 0),
      memory_limit_mb INT              NOT NULL CHECK (memory_limit_mb > 0),
      output_limit_kb INT              NOT NULL DEFAULT 64 CHECK (output_limit_kb > 0),
      created_by      BIGINT           NOT NULL REFERENCES users(id),
      created_at      TIMESTAMPTZ      NOT NULL DEFAULT NOW(),
      updated_at      TIMESTAMPTZ      NOT NULL DEFAULT NOW(),
      deleted_at      TIMESTAMPTZ
    );

    CREATE TABLE problem_testcases (
      id              BIGSERIAL   PRIMARY KEY,
      problem_id      BIGINT      NOT NULL REFERENCES problems(id) ON DELETE CASCADE,
      order_index     INT         NOT NULL,
      is_public       BOOLEAN     NOT NULL DEFAULT FALSE,
      input_data      TEXT        NOT NULL,
      expected_output TEXT        NOT NULL,
      created_at      TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      UNIQUE (problem_id, order_index)
    );

    -- Per-problem language overrides; absence means use language_defaults values
    CREATE TABLE problem_language_limits (
      problem_id        BIGINT       NOT NULL REFERENCES problems(id) ON DELETE CASCADE,
      language          VARCHAR(32)  NOT NULL REFERENCES language_defaults(language),
      time_multiplier   NUMERIC(4,2) NOT NULL CHECK (time_multiplier > 0),
      memory_multiplier NUMERIC(4,2) NOT NULL CHECK (memory_multiplier > 0),
      PRIMARY KEY (problem_id, language)
    );
  04-exam.sql: |
    -- Exam module: exam_sessions and exam_session_problems
    -- NOTE: final_submission_id has NO FK constraint here; the circular FK to
    -- submissions is added in 07-alter-esp.sql after submissions table exists.
    CREATE TABLE exam_sessions (
      id               BIGSERIAL   PRIMARY KEY,
      candidate_id     BIGINT      NOT NULL REFERENCES users(id),
      created_by       BIGINT      NOT NULL REFERENCES users(id),
      status           exam_status NOT NULL DEFAULT 'not_started',
      duration_minutes INT         NOT NULL CHECK (duration_minutes > 0),
      actual_start_at  TIMESTAMPTZ,
      expires_at       TIMESTAMPTZ,
      submitted_at     TIMESTAMPTZ,
      total_score      INT         NOT NULL DEFAULT 0,
      max_score        INT         NOT NULL DEFAULT 0,
      created_at       TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      updated_at       TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE TABLE exam_session_problems (
      id                  BIGSERIAL   PRIMARY KEY,
      exam_session_id     BIGINT      NOT NULL REFERENCES exam_sessions(id) ON DELETE CASCADE,
      problem_id          BIGINT      NOT NULL REFERENCES problems(id),
      order_index         INT         NOT NULL,
      score_weight        INT         NOT NULL CHECK (score_weight >= 0),
      final_submission_id BIGINT,      -- FK to submissions added in 07-alter-esp.sql
      score               INT         NOT NULL DEFAULT 0,
      created_at          TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      updated_at          TIMESTAMPTZ NOT NULL DEFAULT NOW(),
      UNIQUE (exam_session_id, order_index),
      UNIQUE (exam_session_id, problem_id)
    );
  05-submissions.sql: |
    -- Submission module: one row per candidate submit action
    CREATE TABLE submissions (
      id                      BIGSERIAL         PRIMARY KEY,
      exam_session_problem_id BIGINT            NOT NULL REFERENCES exam_session_problems(id) ON DELETE CASCADE,
      candidate_id            BIGINT            NOT NULL REFERENCES users(id),
      language                VARCHAR(32)       NOT NULL REFERENCES language_defaults(language),
      source_code             TEXT              NOT NULL,
      submission_type          submission_type   NOT NULL DEFAULT 'formal',
      status                  submission_status NOT NULL DEFAULT 'pending',
      verdict                 verdict_type,
      runtime_ms              INT,
      memory_kb               INT,
      submitted_at            TIMESTAMPTZ       NOT NULL DEFAULT NOW(),
      judged_at               TIMESTAMPTZ
    );
  06-str.sql: |
    -- Per-testcase judge output; actual_output stored ONLY for public testcases
    CREATE TABLE submission_testcase_results (
      id            BIGSERIAL             PRIMARY KEY,
      submission_id BIGINT                NOT NULL REFERENCES submissions(id) ON DELETE CASCADE,
      testcase_id   BIGINT                NOT NULL REFERENCES problem_testcases(id),
      verdict       testcase_verdict_type NOT NULL,
      runtime_ms    INT,
      memory_kb     INT,
      actual_output TEXT,
      created_at    TIMESTAMPTZ           NOT NULL DEFAULT NOW(),
      UNIQUE (submission_id, testcase_id)
    );
  07-alter-esp.sql: |
    -- Completes the circular FK: exam_session_problems.final_submission_id → submissions.id
    -- DEFERRABLE INITIALLY DEFERRED allows both rows in a transaction without
    -- worrying about insertion order (checked at COMMIT time, not immediately).
    ALTER TABLE exam_session_problems
      ADD CONSTRAINT fk_esp_final_submission
      FOREIGN KEY (final_submission_id)
      REFERENCES submissions(id)
      DEFERRABLE INITIALLY DEFERRED;
  08-indexes.sql: |
    -- All indexes beyond PK / UNIQUE auto-indexes (from PLAN.md §8)

    -- IAM
    CREATE INDEX idx_users_deleted_at        ON users(deleted_at) WHERE deleted_at IS NULL;
    CREATE INDEX idx_user_roles_user_id      ON user_roles(user_id);
    CREATE INDEX idx_user_roles_role_id      ON user_roles(role_id);

    -- Problem
    CREATE INDEX idx_problems_difficulty     ON problems(difficulty) WHERE deleted_at IS NULL;
    CREATE INDEX idx_problems_created_by     ON problems(created_by);
    CREATE INDEX idx_problem_testcases_prob  ON problem_testcases(problem_id, order_index);

    -- Exam
    CREATE INDEX idx_exam_sessions_candidate  ON exam_sessions(candidate_id, created_at DESC);
    CREATE INDEX idx_exam_sessions_created_by ON exam_sessions(created_by);
    CREATE INDEX idx_exam_sessions_status     ON exam_sessions(status);
    CREATE INDEX idx_esp_session              ON exam_session_problems(exam_session_id, order_index);
    CREATE INDEX idx_esp_problem              ON exam_session_problems(problem_id);

    -- Submission
    CREATE INDEX idx_submissions_esp       ON submissions(exam_session_problem_id, submitted_at DESC);
    CREATE INDEX idx_submissions_candidate ON submissions(candidate_id, submitted_at DESC);
    CREATE INDEX idx_submissions_status    ON submissions(status) WHERE status IN ('pending', 'judging');
    CREATE INDEX idx_str_submission        ON submission_testcase_results(submission_id);
  09-seed.sql: |
    -- Static reference data: roles, permissions, bindings, language defaults.
    -- Users and test scenarios are in 10-scenarios.sql.

    INSERT INTO roles (name, description) VALUES
      ('interviewer',    '面試主管：建立面試者帳號、派題、查看結果'),
      ('problem_setter', '出題主管：建立與管理題目'),
      ('candidate',      '面試者：參加考試');

    INSERT INTO permissions (code, description) VALUES
      ('problem:manage', '建立、編輯、刪除題目與測資'),
      ('exam:manage',    '建立面試者帳號、派題、查看所有面試者結果'),
      ('exam:take',      '參加考試、提交程式碼、查看自己的結果');

    INSERT INTO role_permissions (role_id, permission_id)
    SELECT r.id, p.id FROM roles r, permissions p
    WHERE (r.name = 'interviewer'    AND p.code = 'exam:manage')
       OR (r.name = 'problem_setter' AND p.code = 'problem:manage')
       OR (r.name = 'candidate'      AND p.code = 'exam:take');

    INSERT INTO language_defaults (language, display_name, time_multiplier, memory_multiplier) VALUES
      ('cpp17',   'C++17',    1.0, 1.0),
      ('python3', 'Python 3', 3.0, 2.0);
  10-scenarios.sql: "-- Rich test scenario data covering all exam statuses, all verdict
    types,\n-- multi-submission history, and retake deduplication.\n--\n-- Passwords:
    \ root → Root@1234 | staff (alice/bob/carol) → Test@1234 | candidates → Cand@1234\n--\n--
    Sessions:\n--   1  David  (001)  not_started   P1+P4+P7   0/100\n--   2  Emma
    \  (002)  in_progress   P2+P5+P8   0/90  (started 40 min ago)\n--   3  Frank  (003)
    \ submitted     P1+P4+P7   30/100 (P1=AC, P4=WA, P7=CE)\n--   4  Grace  (004)
    \ cancelled     P3+P6+P8   0/90\n--   5  Henry  (005)  submitted     P2+P5+P6
    \  60/90  (first exam)\n--   6  Henry  (005)  submitted     P1+P4+P7   70/100
    (retake, no overlap with sess5)\n\nDO $$\nDECLARE\n  -- Role IDs (from 09-seed.sql)\n
    \ v_role_interviewer BIGINT;\n  v_role_setter      BIGINT;\n  v_role_candidate
    \  BIGINT;\n\n  -- User IDs\n  v_root_id  BIGINT;\n  v_alice_id BIGINT;\n  v_bob_id
    \  BIGINT;\n  v_carol_id BIGINT;\n  v_c1_id    BIGINT;  -- David Chang\n  v_c2_id
    \   BIGINT;  -- Emma Lin\n  v_c3_id    BIGINT;  -- Frank Wu\n  v_c4_id    BIGINT;
    \ -- Grace Lee\n  v_c5_id    BIGINT;  -- Henry Huang\n\n  -- Problem IDs\n  v_p1_id
    BIGINT;  -- Two Sum            (easy)\n  v_p2_id BIGINT;  -- Fibonacci          (easy)\n
    \ v_p3_id BIGINT;  -- Palindrome Check   (easy)\n  v_p4_id BIGINT;  -- Binary
    Search      (medium)\n  v_p5_id BIGINT;  -- Merge Sorted Arrays(medium)\n  v_p6_id
    BIGINT;  -- Valid Parentheses  (medium)\n  v_p7_id BIGINT;  -- LCS                (hard)\n
    \ v_p8_id BIGINT;  -- Coin Change        (hard)\n  -- new added 5 problems\n  v_p9_id
    BIGINT;   -- Container With Most Water (medium)\n  v_p10_id BIGINT;  -- Longest
    Substring Without Repeating Characters (medium)\n  v_p11_id BIGINT;  -- Edit Distance
    (hard)\n  v_p12_id BIGINT;  -- Sliding Window Maximum (hard)\n  v_p13_id BIGINT;
    \ -- N-Queens (hard)\n\n  -- Exam session IDs\n  v_s1_id BIGINT; v_s2_id BIGINT;
    v_s3_id BIGINT;\n  v_s4_id BIGINT; v_s5_id BIGINT; v_s6_id BIGINT;\n\n  -- exam_session_problems
    IDs\n  v_s3_esp1 BIGINT; v_s3_esp2 BIGINT; v_s3_esp3 BIGINT;\n  v_s5_esp1 BIGINT;
    v_s5_esp2 BIGINT; v_s5_esp3 BIGINT;\n  v_s6_esp1 BIGINT; v_s6_esp2 BIGINT; v_s6_esp3
    BIGINT;\n\n  -- Submission IDs (session 3 = Frank)\n  v_sub_s3p1_1 BIGINT; v_sub_s3p1_2
    BIGINT; v_sub_s3p1_3 BIGINT;\n  v_sub_s3p2_1 BIGINT;\n  v_sub_s3p3_1 BIGINT; v_sub_s3p3_2
    BIGINT;\n\n  -- Submission IDs (sessions 5 & 6 = Henry)\n  v_sub_s5p1 BIGINT;
    v_sub_s5p2 BIGINT; v_sub_s5p3 BIGINT;\n  v_sub_s6p1 BIGINT; v_sub_s6p2 BIGINT;
    v_sub_s6p3 BIGINT;\n\nBEGIN\n  -- ================================================================\n
    \ -- 1. USERS\n  -- ================================================================\n
    \ SELECT id INTO v_role_interviewer FROM roles WHERE name = 'interviewer';\n  SELECT
    id INTO v_role_setter      FROM roles WHERE name = 'problem_setter';\n  SELECT
    id INTO v_role_candidate   FROM roles WHERE name = 'candidate';\n\n  -- root:
    superuser, created_by = NULL\n  INSERT INTO users (username, password_hash, display_name,
    is_superuser)\n  VALUES ('root', crypt('Root@1234', gen_salt('bf', 10)), 'System
    Root', TRUE)\n  RETURNING id INTO v_root_id;\n\n  -- staff: created by root\n
    \ INSERT INTO users (username, password_hash, display_name, created_by)\n  VALUES
    ('alice', crypt('Test@1234', gen_salt('bf', 10)), 'Alice Chen', v_root_id)\n  RETURNING
    id INTO v_alice_id;\n\n  INSERT INTO users (username, password_hash, display_name,
    created_by)\n  VALUES ('bob', crypt('Test@1234', gen_salt('bf', 10)), 'Bob Wang',
    v_root_id)\n  RETURNING id INTO v_bob_id;\n\n  INSERT INTO users (username, password_hash,
    display_name, created_by)\n  VALUES ('carol', crypt('Test@1234', gen_salt('bf',
    10)), 'Carol Liu', v_root_id)\n  RETURNING id INTO v_carol_id;\n\n  INSERT INTO
    user_roles (user_id, role_id) VALUES\n    (v_alice_id, v_role_interviewer),\n
    \   (v_bob_id,   v_role_interviewer),\n    (v_bob_id,   v_role_setter),\n    (v_carol_id,
    v_role_setter);\n\n  -- candidates: distributed between alice and bob\n  INSERT
    INTO users (username, password_hash, display_name, created_by)\n  VALUES ('candidate_20260509_001',
    crypt('Cand@1234', gen_salt('bf', 10)), 'David Chang', v_alice_id)\n  RETURNING
    id INTO v_c1_id;\n\n  INSERT INTO users (username, password_hash, display_name,
    created_by)\n  VALUES ('candidate_20260509_002', crypt('Cand@1234', gen_salt('bf',
    10)), 'Emma Lin', v_alice_id)\n  RETURNING id INTO v_c2_id;\n\n  INSERT INTO users
    (username, password_hash, display_name, created_by)\n  VALUES ('candidate_20260509_003',
    crypt('Cand@1234', gen_salt('bf', 10)), 'Frank Wu', v_bob_id)\n  RETURNING id
    INTO v_c3_id;\n\n  INSERT INTO users (username, password_hash, display_name, created_by)\n
    \ VALUES ('candidate_20260509_004', crypt('Cand@1234', gen_salt('bf', 10)), 'Grace
    Lee', v_alice_id)\n  RETURNING id INTO v_c4_id;\n\n  INSERT INTO users (username,
    password_hash, display_name, created_by)\n  VALUES ('candidate_20260509_005',
    crypt('Cand@1234', gen_salt('bf', 10)), 'Henry Huang', v_bob_id)\n  RETURNING
    id INTO v_c5_id;\n\n  INSERT INTO user_roles (user_id, role_id) VALUES\n    (v_c1_id,
    v_role_candidate), (v_c2_id, v_role_candidate),\n    (v_c3_id, v_role_candidate),
    (v_c4_id, v_role_candidate),\n    (v_c5_id, v_role_candidate);\n\n  -- ================================================================\n
    \ -- 2. PROBLEMS\n  -- ================================================================\n\n
    \ -- P1: Two Sum (easy) — 3 testcases: 2 public + 1 hidden\n  INSERT INTO problems
    (title, description_md, difficulty, time_limit_ms, memory_limit_mb, created_by)\n
    \ VALUES (\n    'Two Sum',\n    E'## Problem\\n\\nGiven an array of `n` integers
    and a target, return the 0-based indices of two numbers that add up to target.\\n\\n**Input:**
    Line 1: `n`; Line 2: `n` integers; Line 3: `target`\\n**Output:** Two space-separated
    indices\\n\\n**Example:**\\n```\\n4\\n2 7 11 15\\n9\\n```\\n→ `0 1`',\n    'easy',
    1000, 256, v_carol_id\n  ) RETURNING id INTO v_p1_id;\n\n  INSERT INTO problem_testcases
    (problem_id, order_index, is_public, input_data, expected_output) VALUES\n    (v_p1_id,
    1, TRUE,  E'4\\n2 7 11 15\\n9', '0 1'),\n    (v_p1_id, 2, TRUE,  E'3\\n3 2 4\\n6',
    \    '1 2'),\n    (v_p1_id, 3, FALSE, E'2\\n3 3\\n6',       '0 1');\n\n  -- P2:
    Fibonacci (easy) — 3 testcases: 2 public + 1 hidden\n  INSERT INTO problems (title,
    description_md, difficulty, time_limit_ms, memory_limit_mb, created_by)\n  VALUES
    (\n    'Fibonacci Sequence',\n    E'## Problem\\n\\nReturn the nth Fibonacci number
    (0-indexed: F(0)=0, F(1)=1).\\n\\n**Input:** Single integer `n` (0 ≤ n ≤ 30)\\n**Output:**
    F(n)\\n\\n**Example:** `5` → `5`',\n    'easy', 1000, 128, v_bob_id\n  ) RETURNING
    id INTO v_p2_id;\n\n  INSERT INTO problem_testcases (problem_id, order_index,
    is_public, input_data, expected_output) VALUES\n    (v_p2_id, 1, TRUE,  '5',  '5'),\n
    \   (v_p2_id, 2, TRUE,  '10', '55'),\n    (v_p2_id, 3, FALSE, '20', '6765');\n\n
    \ -- P3: Palindrome Check (easy) — 3 testcases\n  INSERT INTO problems (title,
    description_md, difficulty, time_limit_ms, memory_limit_mb, created_by)\n  VALUES
    (\n    'Palindrome Check',\n    E'## Problem\\n\\nGiven a lowercase string, output
    `true` if palindrome, else `false`.\\n\\n**Input:** Single string\\n**Output:**
    `true` or `false`',\n    'easy', 1000, 128, v_bob_id\n  ) RETURNING id INTO v_p3_id;\n\n
    \ INSERT INTO problem_testcases (problem_id, order_index, is_public, input_data,
    expected_output) VALUES\n    (v_p3_id, 1, TRUE,  'racecar', 'true'),\n    (v_p3_id,
    2, FALSE, 'hello',   'false'),\n    (v_p3_id, 3, FALSE, 'abcba',   'true');\n\n
    \ -- P4: Binary Search (medium) — 4 testcases: 2 public + 2 hidden\n  INSERT INTO
    problems (title, description_md, difficulty, time_limit_ms, memory_limit_mb, created_by)\n
    \ VALUES (\n    'Binary Search',\n    E'## Problem\\n\\nSearch for `target` in
    a sorted array. Return 0-based index, or `-1` if not found.\\n\\n**Input:** Line
    1: `n`; Line 2: `n` sorted integers; Line 3: `target`\\n**Output:** Index or `-1`',\n
    \   'medium', 1000, 256, v_carol_id\n  ) RETURNING id INTO v_p4_id;\n\n  INSERT
    INTO problem_testcases (problem_id, order_index, is_public, input_data, expected_output)
    VALUES\n    (v_p4_id, 1, TRUE,  E'5\\n1 3 5 7 9\\n5', '2'),\n    (v_p4_id, 2,
    TRUE,  E'5\\n1 3 5 7 9\\n1', '0'),\n    (v_p4_id, 3, FALSE, E'5\\n1 3 5 7 9\\n4',
    '-1'),\n    (v_p4_id, 4, FALSE, E'1\\n7\\n7',          '0');\n\n  -- P5: Merge
    Sorted Arrays (medium) — 3 testcases\n  INSERT INTO problems (title, description_md,
    difficulty, time_limit_ms, memory_limit_mb, created_by)\n  VALUES (\n    'Merge
    Sorted Arrays',\n    E'## Problem\\n\\nMerge two sorted integer arrays into one
    sorted array.\\n\\n**Input:** Line 1: `n`; Line 2: array A; Line 3: `m`; Line
    4: array B\\n**Output:** Merged array, space-separated',\n    'medium', 1000,
    256, v_bob_id\n  ) RETURNING id INTO v_p5_id;\n\n  INSERT INTO problem_testcases
    (problem_id, order_index, is_public, input_data, expected_output) VALUES\n    (v_p5_id,
    1, TRUE,  E'3\\n1 3 5\\n3\\n2 4 6',  '1 2 3 4 5 6'),\n    (v_p5_id, 2, FALSE,
    E'2\\n1 2\\n3\\n3 4 5',     '1 2 3 4 5'),\n    (v_p5_id, 3, FALSE, E'4\\n1 3 7
    9\\n2\\n2 8',   '1 2 3 7 8 9');\n\n  -- P6: Valid Parentheses (medium) — 4 testcases:
    2 public + 2 hidden\n  INSERT INTO problems (title, description_md, difficulty,
    time_limit_ms, memory_limit_mb, created_by)\n  VALUES (\n    'Valid Parentheses',\n
    \   E'## Problem\\n\\nDetermine if a string of `()[]{}` is valid.\\n\\n**Input:**
    Single string\\n**Output:** `true` or `false`',\n    'medium', 1000, 256, v_carol_id\n
    \ ) RETURNING id INTO v_p6_id;\n\n  INSERT INTO problem_testcases (problem_id,
    order_index, is_public, input_data, expected_output) VALUES\n    (v_p6_id, 1,
    TRUE,  '()',     'true'),\n    (v_p6_id, 2, TRUE,  '()[]{', 'false'),\n    (v_p6_id,
    3, FALSE, '{[()]}', 'true'),\n    (v_p6_id, 4, FALSE, '([)]',   'false');\n\n
    \ -- P7: Longest Common Subsequence (hard) — 4 testcases: 2 public + 2 hidden\n
    \ INSERT INTO problems (title, description_md, difficulty, time_limit_ms, memory_limit_mb,
    created_by)\n  VALUES (\n    'Longest Common Subsequence',\n    E'## Problem\\n\\nReturn
    the length of the LCS of two strings.\\n\\n**Input:** Line 1: s1; Line 2: s2\\n**Output:**
    Integer LCS length',\n    'hard', 2000, 512, v_bob_id\n  ) RETURNING id INTO v_p7_id;\n\n
    \ INSERT INTO problem_testcases (problem_id, order_index, is_public, input_data,
    expected_output) VALUES\n    (v_p7_id, 1, TRUE,  E'abcde\\nace',             '3'),\n
    \   (v_p7_id, 2, TRUE,  E'abc\\nabc',               '3'),\n    (v_p7_id, 3, FALSE,
    E'abc\\ndef',               '0'),\n    (v_p7_id, 4, FALSE, E'oxcpqrsvwf\\nmynstqcpxa',
    '5');\n\n  -- P8: Coin Change (hard) — 3 testcases; python3 has stricter 2x override\n
    \ INSERT INTO problems (title, description_md, difficulty, time_limit_ms, memory_limit_mb,
    created_by)\n  VALUES (\n    'Coin Change',\n    E'## Problem\\n\\nFind minimum
    coins to reach amount. Return `-1` if impossible.\\n\\n**Input:** Line 1: `n`;
